name: Deploy Earth Copilot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force deploy all components'
        type: boolean
        default: false
      disable_private_endpoints:
        description: 'Disable private endpoints (enable public access)'
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Detect which components need deployment
  # ─────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      deploy_infra:    ${{ steps.detect.outputs.deploy_infra }}
      deploy_backend:  ${{ steps.detect.outputs.deploy_backend }}
      deploy_frontend: ${{ steps.detect.outputs.deploy_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        id: detect
        run: |
          if [[ "${{ inputs.force_all }}" == "true" ]]; then
            echo "deploy_infra=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_backend=true"  >> "$GITHUB_OUTPUT"
            echo "deploy_frontend=true" >> "$GITHUB_OUTPUT"
            echo "Force-all: deploying all components"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -qE "^earth-copilot/infra/"; then
              echo "deploy_infra=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_infra=false" >> "$GITHUB_OUTPUT"
            fi

            if echo "$CHANGED" | grep -qE "^earth-copilot/(container-app/|__init__|requirements)"; then
              echo "deploy_backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_backend=false" >> "$GITHUB_OUTPUT"
            fi

            if echo "$CHANGED" | grep -qE "^earth-copilot/web-ui/"; then
              echo "deploy_frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_frontend=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Azure Infrastructure (Bicep)
  # ─────────────────────────────────────────────────────────
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_infra == 'true'
    outputs:
      resource_group: ${{ steps.info.outputs.resource_group }}
      location:       ${{ steps.info.outputs.location }}
      project_name:   ${{ steps.info.outputs.project_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve deployment variables
        id: info
        run: |
          PROJECT="${{ vars.PROJECT_NAME }}"
          PROJECT="${PROJECT:-earthcopilot}"
          LOCATION="${{ vars.LOCATION }}"
          LOCATION="${LOCATION:-eastus2}"
          RG="${{ vars.RESOURCE_GROUP }}"
          RG="${RG:-rg-${PROJECT}}"
          echo "project_name=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION"    >> "$GITHUB_OUTPUT"
          echo "resource_group=$RG"    >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep (subscription scope)
        run: |
          DEPLOYMENT_NAME="earth-copilot-$(date +%Y%m%d-%H%M%S)"
          ENABLE_PE="true"
          if [[ "${{ inputs.disable_private_endpoints }}" == "true" ]]; then
            ENABLE_PE="false"
          fi

          az deployment sub create \
            --location "${{ steps.info.outputs.location }}" \
            --template-file "earth-copilot/infra/main.bicep" \
            --parameters "earth-copilot/infra/main.parameters.json" \
            --parameters environmentName="${{ steps.info.outputs.project_name }}" \
            --parameters location="${{ steps.info.outputs.location }}" \
            --parameters enablePrivateEndpoints="$ENABLE_PE" \
            --name "$DEPLOYMENT_NAME" \
            --verbose

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy Backend (Container App)
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: dev
    needs: [detect-changes, deploy-infrastructure]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_backend == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    outputs:
      container_app_fqdn: ${{ steps.deploy-ca.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve resource names
        id: res
        run: |
          PROJECT="${{ vars.PROJECT_NAME }}"
          PROJECT="${PROJECT:-earthcopilot}"
          RG="${{ vars.RESOURCE_GROUP }}"
          RG="${RG:-rg-${PROJECT}}"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

          # ACR
          REGISTRY=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

          # Container Apps Environment (needed for initial create)
          CAE=$(az containerapp env list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          echo "cae=$CAE" >> "$GITHUB_OUTPUT"

          # Derive resource token from CAE name (cae-<token>)
          TOKEN="${CAE#cae-}"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          # Container App (may not exist on first deploy)
          CA_NAME=$(az containerapp list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          echo "container_app=${CA_NAME}" >> "$GITHUB_OUTPUT"

          # Expected name following Bicep convention: ca-web-<token>
          echo "container_app_expected=ca-web-${TOKEN}" >> "$GITHUB_OUTPUT"

          # Lookup env vars needed to configure the Container App
          OAI_ENDPOINT=$(az cognitiveservices account list --resource-group "$RG" \
            --query "[?kind=='AIServices'].properties.endpoint | [0]" -o tsv 2>/dev/null || true)
          echo "oai_endpoint=${OAI_ENDPOINT}" >> "$GITHUB_OUTPUT"

          APPINS_CS=$(az resource list --resource-group "$RG" \
            --resource-type "Microsoft.Insights/components" --query "[0].name" -o tsv 2>/dev/null || true)
          if [[ -n "$APPINS_CS" ]]; then
            CS=$(az monitor app-insights component show \
              --app "$APPINS_CS" --resource-group "$RG" \
              --query "connectionString" -o tsv 2>/dev/null || true)
            echo "appinsights_cs=${CS}" >> "$GITHUB_OUTPUT"
          fi

          MAPS_NAME=$(az maps account list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || true)
          if [[ -n "$MAPS_NAME" ]]; then
            MAPS_KEY=$(az maps account keys list --name "$MAPS_NAME" --resource-group "$RG" \
              --query "primaryKey" -o tsv 2>/dev/null || true)
            echo "maps_key=${MAPS_KEY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image in ACR
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          REGISTRY="${{ steps.res.outputs.registry }}"

          # Temporarily open ACR firewall so ACR Tasks can run
          echo "Opening ACR firewall for build..."
          az acr update --name "$REGISTRY" --default-action Allow --output none
          sleep 15

          # Build via ACR Tasks (runs inside Azure)
          az acr build \
            --registry "$REGISTRY" \
            --image "earthcopilot-api:${IMAGE_TAG}" \
            --image "earthcopilot-api:latest" \
            --file "earth-copilot/container-app/Dockerfile.complete" \
            earth-copilot/ || BUILD_FAILED=true

          # Re-lock ACR firewall regardless of build result
          echo "Re-locking ACR firewall..."
          az acr update --name "$REGISTRY" --default-action Deny --output none

          if [[ "${BUILD_FAILED:-}" == "true" ]]; then
            echo "ACR build failed"; exit 1
          fi

      - name: "Create or Update Container App"
        id: deploy-ca
        env:
          AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
        run: |
          RG="${{ steps.res.outputs.resource_group }}"
          REGISTRY="${{ steps.res.outputs.registry }}"
          CAE="${{ steps.res.outputs.cae }}"
          OAI_EP="${{ steps.res.outputs.oai_endpoint }}"
          APPINS="${{ steps.res.outputs.appinsights_cs }}"
          MAPS_KEY="${{ steps.res.outputs.maps_key }}"

          # Get tenant ID for auth middleware
          TENANT_ID=$(az account show --query tenantId -o tsv)

          # Determine Container App name
          CA="${{ steps.res.outputs.container_app }}"
          if [[ -z "$CA" ]]; then
            CA="${{ steps.res.outputs.container_app_expected }}"
            echo "No existing Container App found — will create: $CA"
            CREATE_MODE=true
          else
            echo "Found existing Container App: $CA"
            CREATE_MODE=false
          fi

          # Build env var list
          ENV_VARS=(
            "PORT=8080"
            "STAC_API_URL=https://planetarycomputer.microsoft.com/api/stac/v1"
            "CORS_ORIGINS=*"
            "USE_MANAGED_IDENTITY=true"
            "DISABLE_AUTH=true"
          )
          [[ -n "$OAI_EP"      ]] && ENV_VARS+=("AZURE_OPENAI_ENDPOINT=$OAI_EP")
          [[ -n "$APPINS"      ]] && ENV_VARS+=("APPLICATION_INSIGHTS_CONNECTION_STRING=$APPINS")
          [[ -n "$MAPS_KEY"    ]] && ENV_VARS+=("AZURE_MAPS_SUBSCRIPTION_KEY=$MAPS_KEY")
          [[ -n "$TENANT_ID"   ]] && ENV_VARS+=("AZURE_AD_TENANT_ID=$TENANT_ID")
          [[ -n "$AUTH_CLIENT_ID" ]] && ENV_VARS+=("AZURE_AD_CLIENT_ID=$AUTH_CLIENT_ID")

          if [[ "$CREATE_MODE" == "true" ]]; then
            # Initial creation
            az containerapp create \
              --name "$CA" \
              --resource-group "$RG" \
              --environment "$CAE" \
              --registry-server "${REGISTRY}.azurecr.io" \
              --registry-identity system \
              --image "${REGISTRY}.azurecr.io/earthcopilot-api:${IMAGE_TAG}" \
              --ingress external \
              --target-port 8080 \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --env-vars "${ENV_VARS[@]}" \
              --output none

            # Grant AcrPull role to the Container App's managed identity
            sleep 10
            PRINCIPAL_ID=$(az containerapp show --name "$CA" --resource-group "$RG" \
              --query "identity.principalId" -o tsv)
            ACR_ID=$(az acr show --name "$REGISTRY" --resource-group "$RG" --query "id" -o tsv)
            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role AcrPull \
              --scope "$ACR_ID" \
              --output none || true
          else
            # Subsequent updates
            az containerapp update \
              --name "$CA" \
              --resource-group "$RG" \
              --image "${REGISTRY}.azurecr.io/earthcopilot-api:${IMAGE_TAG}" \
              --set-env-vars "${ENV_VARS[@]}" \
              --output none
          fi

          FQDN=$(az containerapp show --name "$CA" --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "Backend FQDN: $FQDN"

  # ─────────────────────────────────────────────────────────
  # JOB 4: Deploy Frontend (App Service)
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: dev
    needs: [detect-changes, deploy-infrastructure, deploy-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_frontend == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    outputs:
      webapp_url: ${{ steps.deploy-webapp.outputs.webapp_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: earth-copilot/web-ui/package-lock.json

      - name: Resolve resource names
        id: res
        run: |
          PROJECT="${{ vars.PROJECT_NAME }}"
          PROJECT="${PROJECT:-earthcopilot}"
          RG="${{ vars.RESOURCE_GROUP }}"
          RG="${RG:-rg-${PROJECT}}"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

          # The Container App already serves the React frontend via FastAPI
          # Use Container App FQDN as the frontend URL
          BACKEND_FQDN="${{ needs.deploy-backend.outputs.container_app_fqdn }}"
          if [[ -z "$BACKEND_FQDN" ]]; then
            BACKEND_FQDN=$(az containerapp list --resource-group "$RG" \
              --query "[0].properties.configuration.ingress.fqdn" -o tsv 2>/dev/null)
          fi
          echo "backend_url=https://${BACKEND_FQDN}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${BACKEND_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: earth-copilot/web-ui
        run: npm ci

      - name: Build production bundle (verify)
        working-directory: earth-copilot/web-ui
        env:
          VITE_API_BASE_URL: ${{ steps.res.outputs.backend_url }}
        run: npm run build

      - name: Confirm frontend served by Container App
        id: deploy-webapp
        run: |
          # The React frontend is bundled into the Container App Docker image
          # (Dockerfile.complete copies dist/ to /app/static/, FastAPI serves it)
          # No separate App Service deployment needed.
          FRONTEND_URL="${{ steps.res.outputs.frontend_url }}"
          echo "webapp_url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"
          echo "Frontend URL: ${FRONTEND_URL}"

  # ─────────────────────────────────────────────────────────
  # JOB 5: Enable Agent Service on AI Foundry
  # ─────────────────────────────────────────────────────────
  enable-agent-service:
    name: Enable Agent Service
    runs-on: ubuntu-latest
    environment: dev
    needs: [deploy-infrastructure, deploy-backend]
    if: |
      always() &&
      needs.deploy-backend.result == 'success' &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable Agent Service
        shell: pwsh
        run: |
          $Project = "${{ vars.PROJECT_NAME }}"
          if ([string]::IsNullOrEmpty($Project)) { $Project = "earthcopilot" }
          $RG = "${{ vars.RESOURCE_GROUP }}"
          if ([string]::IsNullOrEmpty($RG)) { $RG = "rg-$Project" }

          ./scripts/enable-agent-service.ps1 -ResourceGroup $RG

  # ─────────────────────────────────────────────────────────
  # JOB 6: Configure Entra ID Authentication (EasyAuth)
  # ─────────────────────────────────────────────────────────
  configure-auth:
    name: Configure Auth
    runs-on: ubuntu-latest
    environment: dev
    needs: [deploy-backend, deploy-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure EasyAuth (skip if AUTH_CLIENT_ID not set)
        env:
          AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$AUTH_CLIENT_ID" ]]; then
            echo "AUTH_CLIENT_ID not set — skipping authentication configuration"
            exit 0
          fi

          PROJECT="${{ vars.PROJECT_NAME }}"
          PROJECT="${PROJECT:-earthcopilot}"
          RG="${{ vars.RESOURCE_GROUP }}"
          RG="${RG:-rg-${PROJECT}}"
          TENANT_ID=$(az account show --query tenantId -o tsv)

          echo "Configuring EasyAuth for resource group: $RG"
          echo "Tenant ID: $TENANT_ID"
          echo "Auth Client ID: $AUTH_CLIENT_ID"

          # ── Frontend: App Service (redirect to Microsoft login) ──
          WEBAPP=$(az webapp list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          if [[ -n "$WEBAPP" ]]; then
            WEBAPP_HOST=$(az webapp show --name "$WEBAPP" --resource-group "$RG" \
              --query "defaultHostName" -o tsv)
            REDIRECT_URI="https://${WEBAPP_HOST}/.auth/login/aad/callback"

            echo "Adding redirect URI: $REDIRECT_URI"
            az ad app update \
              --id "$AUTH_CLIENT_ID" \
              --web-redirect-uris "$REDIRECT_URI" 2>/dev/null || \
              echo "Warning: could not update redirect URI (may require Graph permissions)"

            az webapp auth update \
              --name "$WEBAPP" --resource-group "$RG" \
              --enabled true \
              --action LoginWithAzureActiveDirectory \
              --output none

            az webapp auth microsoft update \
              --name "$WEBAPP" --resource-group "$RG" \
              --client-id "$AUTH_CLIENT_ID" \
              --tenant-id "$TENANT_ID" \
              --output none

            echo "✅ App Service auth configured: $WEBAPP"
          fi

          # ── Backend: Container App (redirect to login for unauthenticated) ──
          CA=$(az containerapp list --resource-group "$RG" \
            --query "[?contains(name,'api') || contains(name,'backend')].name | [0]" -o tsv 2>/dev/null)
          if [[ -z "$CA" ]]; then
            CA=$(az containerapp list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          fi

          if [[ -n "$CA" ]]; then
            CA_FQDN=$(az containerapp show --name "$CA" --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            CA_REDIRECT_URI="https://${CA_FQDN}/.auth/login/aad/callback"

            # Collect existing redirect URIs and add the new one
            EXISTING_URIS=$(az ad app show --id "$AUTH_CLIENT_ID" \
              --query "web.redirectUris" -o tsv 2>/dev/null | tr '\n' ' ')
            ALL_URIS="$CA_REDIRECT_URI"
            for uri in $EXISTING_URIS; do
              [[ "$uri" != "$CA_REDIRECT_URI" ]] && ALL_URIS="$ALL_URIS $uri"
            done

            az ad app update \
              --id "$AUTH_CLIENT_ID" \
              --web-redirect-uris $ALL_URIS 2>/dev/null || \
              echo "Warning: could not update redirect URI"

            az containerapp auth update \
              --name "$CA" --resource-group "$RG" \
              --unauthenticated-client-action RedirectToLoginPage \
              --enabled true \
              --output none

            az containerapp auth microsoft update \
              --name "$CA" --resource-group "$RG" \
              --client-id "$AUTH_CLIENT_ID" \
              --tenant-id "$TENANT_ID" \
              ${AUTH_CLIENT_SECRET:+--client-secret "$AUTH_CLIENT_SECRET" --yes} \
              --output none

            # Use response_mode=query (GET callback) to avoid SameSite cookie
            # issues that cause 401 on the form_post (POST) callback
            SUBSCRIPTION=$(az account show --query id -o tsv)
            az rest \
              --method PUT \
              --uri "https://management.azure.com/subscriptions/${SUBSCRIPTION}/resourceGroups/${RG}/providers/Microsoft.App/containerApps/${CA}/authConfigs/current?api-version=2024-03-01" \
              --headers "Content-Type=application/json" \
              --body "{\"properties\":{\"platform\":{\"enabled\":true},\"globalValidation\":{\"unauthenticatedClientAction\":\"RedirectToLoginPage\"},\"identityProviders\":{\"azureActiveDirectory\":{\"isAutoProvisioned\":false,\"registration\":{\"clientId\":\"${AUTH_CLIENT_ID}\",\"clientSecretSettingName\":\"microsoft-provider-authentication-secret\",\"openIdIssuer\":\"https://login.microsoftonline.com/${TENANT_ID}/v2.0\"},\"login\":{\"loginParameters\":[\"response_type=code\",\"response_mode=query\",\"scope=openid profile email\"]},\"validation\":{\"allowedAudiences\":[\"${AUTH_CLIENT_ID}\",\"api://${AUTH_CLIENT_ID}\"]}}}}}" \
              --output none 2>/dev/null || echo "Warning: could not set loginParameters (non-fatal)"

            echo "✅ Container App auth configured: $CA (redirect: $CA_REDIRECT_URI)"
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 7: Deployment Summary
  # ─────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - deploy-infrastructure
      - deploy-backend
      - deploy-frontend
      - enable-agent-service
      - configure-auth
    if: always()
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Print deployment summary
        run: |
          PROJECT="${{ vars.PROJECT_NAME }}"
          PROJECT="${PROJECT:-earthcopilot}"
          RG="${{ vars.RESOURCE_GROUP }}"
          RG="${RG:-rg-${PROJECT}}"

          echo ""
          echo "=================================================="
          echo "         EARTH COPILOT DEPLOYMENT SUMMARY"
          echo "=================================================="
          echo ""
          echo "Job results:"
          echo "  Infrastructure : ${{ needs.deploy-infrastructure.result }}"
          echo "  Backend        : ${{ needs.deploy-backend.result }}"
          echo "  Frontend       : ${{ needs.deploy-frontend.result }}"
          echo "  Agent Service  : ${{ needs.enable-agent-service.result }}"
          echo "  Auth           : ${{ needs.configure-auth.result }}"
          echo ""

          WEBAPP=$(az webapp list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)
          CA=$(az containerapp list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null)

          if [[ -n "$WEBAPP" ]]; then
            WEBAPP_HOST=$(az webapp show --name "$WEBAPP" --resource-group "$RG" \
              --query "defaultHostName" -o tsv 2>/dev/null)
            echo "  Frontend URL   : https://${WEBAPP_HOST}"
          fi

          if [[ -n "$CA" ]]; then
            CA_HOST=$(az containerapp show --name "$CA" --resource-group "$RG" \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null)
            echo "  Backend API    : https://${CA_HOST}"
            echo "  API Docs       : https://${CA_HOST}/docs"
          fi

          AUTH_CONFIGURED="${{ secrets.AUTH_CLIENT_ID != '' }}"
          if [[ "$AUTH_CONFIGURED" == "true" ]]; then
            echo "  Auth           : Entra ID EasyAuth enabled"
          else
            echo "  Auth           : Not configured (AUTH_CLIENT_ID not set)"
          fi
          echo ""
          echo "=================================================="
